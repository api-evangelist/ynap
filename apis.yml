name: YOOX NET-A-PORTER (YNAP)
description: YOOX NET-A-PORTER (YNAP) is a leading digital multi-brand luxury fashion group operating
  the online stores NET-A-PORTER, MR PORTER, YOOX, and THE OUTNET. Following the 2025 acquisition by
  Mytheresa, the group operates under the parent LuxExperience B.V. (NYSE ticker "LUXE"), pairing
  full-price curated luxury with off-price destinations. YNAP was surfaced as a portfolio company of
  balderton-capital and added to the API Evangelist network. The group runs an engineering organization
  (YNAP Tech) and maintains public GitHub open-source tooling, but publishes no public developer API,
  OpenAPI specification, or partner developer portal at this time.
